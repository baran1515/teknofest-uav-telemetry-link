name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Bench test (fake vehicle -> monitor -> analyze)
        run: DUR=10 bash scripts/bench_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: reports/bench/
